
<script>
/* ZAINAB MOBILE CARE — WHATSAPP CONFIG */
const WHATSAPP_NUMBER = "917028561281";

/* Open WhatsApp with correctly encoded message */
function openWhatsApp(message) {
  const url =
    "https://wa.me/" + WHATSAPP_NUMBER +
    "?text=" + encodeURIComponent(message);

  window.open(url, "_blank", "noopener,noreferrer");
}

/* FOOTER YEAR */
document.getElementById("year").textContent =
  new Date().getFullYear();

/* FLOATING WHATSAPP BUTTON */
document.getElementById("whatsappFloat").addEventListener(
  "click",
  function(event) {
    event.preventDefault();

    openWhatsApp(
      "Hello Zainab Mobile Care! I would like to enquire about mobile repair."
    );
  }
);

/* MOBILE NAVIGATION */
const menuToggle = document.getElementById("menuToggle");
const navlinks = document.getElementById("navlinks");

menuToggle.addEventListener("click", function() {
  const isOpen = navlinks.classList.toggle("open");

  menuToggle.setAttribute("aria-expanded", String(isOpen));
  menuToggle.textContent = isOpen ? "✕ CLOSE" : "☰ MENU";
});

navlinks.querySelectorAll("a").forEach(function(link) {
  link.addEventListener("click", function() {
    navlinks.classList.remove("open");
    menuToggle.setAttribute("aria-expanded", "false");
    menuToggle.textContent = "☰ MENU";
  });
});

/* INTERACTIVE 3D PHONE */
const phoneStage = document.getElementById("phoneStage");
const heroPhone = document.getElementById("heroPhone");

if (window.matchMedia("(hover:hover)").matches) {
  phoneStage.addEventListener("pointermove", function(event) {
    const rect = phoneStage.getBoundingClientRect();
    const x = (event.clientX - rect.left) / rect.width - 0.5;
    const y = (event.clientY - rect.top) / rect.height - 0.5;

    heroPhone.style.animation = "none";
    heroPhone.style.transform =
      "rotateY(" + (-20 + x * 25) + "deg) " +
      "rotateX(" + (-y * 18) + "deg)";
  });

  phoneStage.addEventListener("pointerleave", function() {
    heroPhone.style.animation = "";
    heroPhone.style.transform = "";
  });
}

/* SMART REPAIR FINDER */
let finderData = null;

document.getElementById("finderForm").addEventListener(
  "submit",
  function(event) {
    event.preventDefault();

    finderData = {
      brand: document.getElementById("finderBrand").value,
      model: document.getElementById("finderModel").value.trim(),
      issue: document.getElementById("finderIssue").value,
      area: document.getElementById("finderArea").value.trim()
    };

    document.getElementById("finderSummary").textContent =
      finderData.brand + " " + finderData.model +
      " · " + finderData.issue +
      " · " + finderData.area;

    document.getElementById("finderResult").classList.add("show");

    document.getElementById("finderResult").scrollIntoView({
      behavior: "smooth",
      block: "nearest"
    });
  }
);

document.getElementById("finderBook").addEventListener(
  "click",
  function() {
    if (!finderData) return;

    const message =
      "Hello Zainab Mobile Care!\n" +
      "I would like to enquire about a repair.\n\n" +
      "Brand: " + finderData.brand + "\n" +
      "Model: " + finderData.model + "\n" +
      "Issue: " + finderData.issue + "\n" +
      "Area: " + finderData.area;

    openWhatsApp(message);
  }
);

/* EXPLODED PHONE ANIMATION */
const explodedStage = document.getElementById("explodedStage");
const explodeBtn = document.getElementById("explodeBtn");

explodeBtn.addEventListener("click", function() {
  const isOpen = explodedStage.classList.toggle("open");

  explodeBtn.setAttribute("aria-pressed", String(isOpen));
  explodeBtn.textContent = isOpen
    ? "ASSEMBLE THE PHONE ↗"
    : "EXPLODE THE PHONE ↗";
});

/* BEFORE / AFTER SLIDER */
const compareRange = document.getElementById("compareRange");
const compareFrame = document.getElementById("compareFrame");
const compareAfter = document.getElementById("compareAfter");
const compareLine = document.getElementById("compareLine");

function updateCompare() {
  const value = compareRange.value + "%";

  compareFrame.style.setProperty("--split", value);
  compareAfter.style.clipPath = "inset(0 0 0 " + value + ")";
  compareLine.style.left = value;
}

compareRange.addEventListener("input", updateCompare);
updateCompare();

/* SERVICE SHORTCUTS */
document.querySelectorAll("[data-service]").forEach(function(link) {
  link.addEventListener("click", function() {
    const select = document.getElementById("bookingService");
    const wanted = link.getAttribute("data-service").toLowerCase();

    const option = Array.from(select.options).find(function(opt) {
      return opt.text.toLowerCase().includes(wanted);
    });

    if (option) {
      select.value = option.value;
    }
  });
});

/* BOOKING FORM */
document.getElementById("bookingForm").addEventListener(
  "submit",
  function(event) {
    event.preventDefault();

    const name =
      document.getElementById("customerName").value.trim();

    const contact =
      document.getElementById("customerPhone").value.trim();

    const brand =
      document.getElementById("bookingBrand").value;

    const model =
      document.getElementById("bookingModel").value.trim();

    const service =
      document.getElementById("bookingService").value;

    const date =
      document.getElementById("bookingDate").value ||
      "Not specified";

    const time =
      document.getElementById("bookingTime").value ||
      "Flexible";

    const area =
      document.getElementById("bookingArea").value.trim();

    const problem =
      document.getElementById("bookingProblem").value.trim() ||
      "Not specified";

    const message =
      "Hello Zainab Mobile Care!\n" +
      "I would like to make a doorstep repair enquiry.\n\n" +
      "Name: " + name + "\n" +
      "Contact: " + contact + "\n" +
      "Brand: " + brand + "\n" +
      "Model: " + model + "\n" +
      "Service: " + service + "\n" +
      "Preferred Date: " + date + "\n" +
      "Preferred Time: " + time + "\n" +
      "Area: " + area + "\n" +
      "Problem: " + problem;

    openWhatsApp(message);
  }
);
</script>
